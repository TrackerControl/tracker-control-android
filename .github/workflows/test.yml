name: Test

on:
  push:
    branches: [ master, main ]
    tags: [ '[0-9]*' ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          # Robolectric SDK 36 (see app/src/test/resources/robolectric.properties)
          # ships jars compiled with Java 21 and refuses to run on Java 17.
          java-version: '21'
          distribution: 'temurin'

      - name: Install Android native build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wgbridge-rs/target
          key: cargo-${{ runner.os }}-${{ hashFiles('wgbridge-rs/Cargo.lock') }}

      - name: Set up Rust
        run: ./scripts/setup_rust_android.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Prefetch Gradle dependencies
        run: |
          ./gradlew :app:dependencies
          ./gradlew :app:prefetchAndroidLintDependencies
          # :app:dependencies only resolves dependency metadata, not the
          # actual test-variant classpath artifacts (e.g. mockwebserver3).
          # Compile the unit tests online once so their classpath is cached
          # before the offline run below.
          ./gradlew :app:assembleFdroidDebugUnitTest
          # Compiling and assembling only ever resolves compile classpaths, so
          # runtime-scoped transitive dependencies stay uncached. Resolve the
          # runtime classpaths too, or the offline steps below cannot find them.
          ./gradlew :app:prefetchOfflineBuildClasspaths

      - name: Run Rust unit tests
        run: |
          # Covers the whole workspace, including the FFI-boundary tests for
          # the C ABI the NetGuard engine calls (wgbridge-rs/tests/).
          cargo test --manifest-path wgbridge-rs/Cargo.toml --workspace --locked --offline

      - name: Run DNS-over-TCP framing host tests
        run: |
          cc -Wall -Wextra -Werror -Iapp/src/main/jni/netguard \
            -o /tmp/dns_frame_test \
            app/src/test/native/dns_frame_test.c app/src/main/jni/netguard/dns_frame.c
          /tmp/dns_frame_test

      - name: Run IPv6 extension header walk host tests
        run: |
          cc -Wall -Wextra -Werror -Iapp/src/main/jni/netguard \
            -o /tmp/ip6_ext_test \
            app/src/test/native/ip6_ext_test.c app/src/main/jni/netguard/ip6_ext.c
          /tmp/ip6_ext_test

      - name: Run unit tests
        run: ./gradlew testFdroidDebugUnitTest --offline

      - name: Build F-Droid release APK offline
        run: ./gradlew :app:assembleFdroidRelease --offline

      - name: Verify WireGuard libraries in F-Droid APK
        run: |
          APK=$(find app/build/outputs/apk/fdroid -type f -name '*.apk' -print -quit)
          test -n "$APK"
          for ABI in armeabi-v7a arm64-v8a x86 x86_64; do
            test "$(unzip -Z1 "$APK" "lib/$ABI/libwgbridge.so")" = "lib/$ABI/libwgbridge.so"
          done

          # The routing policy is reached by dlsym from libnetguard, so a
          # stripped or renamed export degrades silently into "no per-app
          # routing" rather than failing the build. readelf reads any
          # architecture's ELF, unlike the host nm.
          for ABI in armeabi-v7a arm64-v8a x86 x86_64; do
            unzip -p "$APK" "lib/$ABI/libwgbridge.so" > /tmp/libwgbridge-$ABI.so
            SYMS=$(readelf --dyn-syms --wide "/tmp/libwgbridge-$ABI.so" | awk '{print $NF}')
            for SYM in tc_policy_abi_version tc_policy_set_route_uids \
                       tc_policy_clear_route_uids tc_policy_is_tunnel_uid \
                       tc_policy_wants_tunnel; do
              echo "$SYMS" | grep -qx "$SYM" \
                || { echo "missing dynamic symbol $SYM in $ABI"; exit 1; }
            done
          done

  instrumentation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android native build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wgbridge-rs/target
          key: cargo-android-${{ runner.os }}-${{ hashFiles('wgbridge-rs/Cargo.lock') }}

      - name: Set up Rust
        run: ./scripts/setup_rust_android.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Prefetch Gradle dependencies
        run: |
          ./gradlew :app:dependencies
          # Warm the cache for the androidTest classpath (androidx.test.*).
          # Running the tests themselves still needs network access: the
          # Unified Test Platform runner classpath (UTP, dagger, protobuf,
          # etc.) is only resolved once a device is actually connected.
          ./gradlew :app:assembleFdroidDebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          # API 37 has no published emulator system image yet; 36 is the
          # newest one available while compileSdk/targetSdk track the preview.
          api-level: 36
          arch: x86_64
          ndk: 27.2.12479018
          profile: pixel_7
          script: ./gradlew connectedFdroidDebugAndroidTest
